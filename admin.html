<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin LEX KOPI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="section-wrap">
    <h1>Admin <em>LEX KOPI.</em></h1>
    <p>Halaman khusus pemilik kedai.</p>

    <form id="admin-login">
      <label for="admin-email">Email admin</label>
      <input id="admin-email" type="email" required>

      <label for="admin-password">Password</label>
      <input id="admin-password" type="password" required>

      <button type="submit">Masuk sebagai admin</button>
      <p id="login-message"></p>
    </form>

    <section id="admin-dashboard" hidden>
      <h2>Dashboard Admin</h2>
      <p>Login berhasil.</p>
      <button id="admin-logout" type="button">Keluar</button>
    </section>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
